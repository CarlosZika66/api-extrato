<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Extrato PDF</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f4f6f8;
        }

        .container {
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }

        h2 {
            margin-top: 0;
            color: #1a1a2e;
        }

        .upload-area {
            margin-bottom: 20px;
        }

        input[type="file"] {
            display: block;
            margin-bottom: 15px;
            padding: 10px;
            border: 2px dashed #ddd;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
        }

        input[type="file"]:hover {
            border-color: #0070f3;
        }

        button {
            background-color: #0070f3;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover:not(:disabled) {
            background-color: #0056cc;
        }

        button:disabled {
            background-color: #ccc;
            cursor: not-allowed;
        }

        #status {
            margin: 15px 0;
            font-weight: 500;
            min-height: 24px;
        }

        .summary {
            background: #f0f7ff;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .summary-item {
            flex: 1;
            min-width: 120px;
        }

        .summary-label {
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .summary-value {
            font-size: 24px;
            font-weight: 700;
            color: #1a1a2e;
        }

        .summary-value.positive { color: #059669; }
        .summary-value.negative { color: #dc2626; }

        .filters {
            margin-bottom: 20px;
            padding: 15px;
            background: #fafafa;
            border-radius: 8px;
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .filters label {
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .filters input[type="text"] {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            min-width: 200px;
        }

        .transactions-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }

        .transactions-table th,
        .transactions-table td {
            padding: 12px 10px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        .transactions-table th {
            background: #f8f9fa;
            font-weight: 600;
            color: #444;
            position: sticky;
            top: 0;
            z-index: 1;
        }

        .transactions-table tr:hover td {
            background: #fafafa;
        }

        .transactions-table .col-data { width: 100px; }
        .transactions-table .col-desc { min-width: 250px; }
        .transactions-table .col-id { width: 140px; font-family: monospace; font-size: 12px; }
        .transactions-table .col-valor { width: 110px; text-align: right; font-weight: 600; font-family: monospace; }

        .valor-positivo { color: #059669; }
        .valor-negativo { color: #dc2626; }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #888;
        }

        .empty-state svg {
            width: 64px;
            height: 64px;
            margin-bottom: 12px;
            opacity: 0.5;
        }

        .warning {
            background: #fffbeb;
            border: 1px solid #fcd34d;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 15px;
            color: #92400e;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .transactions-table {
                font-size: 12px;
            }
            .transactions-table th, .transactions-table td {
                padding: 8px 6px;
            }
        }
    </style>
</head>

<body>

    <div class="container">
        <h2>📄 Leitor de Extrato PDF</h2>
        <p style="color: #666;">Selecione seu extrato bancário em PDF para processar e visualizar as transações organizadas.</p>

        <div class="upload-area">
            <input type="file" id="pdfInput" accept="application/pdf">
            <button id="btnEnviar" onclick="enviarPDF()">Processar PDF</button>
        </div>

        <div id="status"></div>

        <div id="aviso" class="warning" style="display: none;"></div>

        <div id="resumo" class="summary" style="display: none;">
            <div class="summary-item">
                <div class="summary-label">Total Transações</div>
                <div class="summary-value" id="totalTransacoes">0</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Entradas (Créditos)</div>
                <div class="summary-value positive" id="totalCreditos">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Saídas (Débitos)</div>
                <div class="summary-value negative" id="totalDebitos">R$ 0,00</div>
            </div>
            <div class="summary-item">
                <div class="summary-label">Saldo Líquido</div>
                <div class="summary-value" id="saldoLiquido">R$ 0,00</div>
            </div>
        </div>

        <div class="filters">
            <label>
                <input type="checkbox" id="chkMostrarNegativos" checked onchange="filtrarTabela()"> Débitos
            </label>
            <label>
                <input type="checkbox" id="chkMostrarPositivos" checked onchange="filtrarTabela()"> Créditos
            </label>
            <input type="text" id="filtroBusca" placeholder="🔍 Buscar descrição, ID ou valor..." oninput="filtrarTabela()">
        </div>

        <div id="tabelaContainer" style="display: none; overflow-x: auto;">
            <table class="transactions-table" id="tabelaTransacoes">
                <thead>
                    <tr>
                        <th class="col-data">Data</th>
                        <th class="col-desc">Descrição</th>
                        <th class="col-id">ID Operação</th>
                        <th class="col-valor">Valor</th>
                    </tr>
                </thead>
                <tbody id="tbodyTransacoes"></tbody>
            </table>
        </div>

        <div id="emptyState" class="empty-state" style="display: none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
            <p>Nenhuma transação encontrada com os filtros atuais.</p>
        </div>
    </div>

    <script>
        const URL_DA_API = "/processar-pdf";
        let todasTransacoes = [];

        async function enviarPDF() {
            const input = document.getElementById('pdfInput');
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btnEnviar');
            const avisoDiv = document.getElementById('aviso');
            const resumoDiv = document.getElementById('resumo');
            const tabelaContainer = document.getElementById('tabelaContainer');
            const emptyState = document.getElementById('emptyState');
            const tbody = document.getElementById('tbodyTransacoes');

            if (!input.files || input.files.length === 0) {
                alert("Por favor, selecione um arquivo PDF primeiro!");
                return;
            }

            const file = input.files[0];
            const formData = new FormData();
            formData.append("file", file);

            // Reset UI
            statusDiv.innerText = "Enviando e processando PDF...";
            statusDiv.style.color = "#0070f3";
            avisoDiv.style.display = 'none';
            resumoDiv.style.display = 'none';
            tabelaContainer.style.display = 'none';
            emptyState.style.display = 'none';
            tbody.innerHTML = '';
            btn.disabled = true;

            try {
                const response = await fetch(URL_DA_API, {
                    method: "POST",
                    body: formData
                });

                if (!response.ok) {
                    throw new Error("Erro na requisição: " + response.statusText);
                }

                const data = await response.json();
                todasTransacoes = data.transacoes || [];

                statusDiv.innerText = `✅ Processado com sucesso! ${data.total_transacoes} transações encontradas.`;
                statusDiv.style.color = "#059669";

                if (data.aviso) {
                    avisoDiv.innerText = "⚠️ " + data.aviso;
                    avisoDiv.style.display = 'block';
                }

                if (todasTransacoes.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                }

                // Calcula totais
                let totalCreditos = 0;
                let totalDebitos = 0;

                todasTransacoes.forEach(t => {
                    const valor = parseFloat(t.Valor.replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                    if (valor >= 0) totalCreditos += valor;
                    else totalDebitos += Math.abs(valor);
                });

                document.getElementById('totalTransacoes').innerText = todasTransacoes.length;
                document.getElementById('totalCreditos').innerText = formatarMoeda(totalCreditos);
                document.getElementById('totalDebitos').innerText = formatarMoeda(totalDebitos);
                document.getElementById('saldoLiquido').innerText = formatarMoeda(totalCreditos - totalDebitos);
                document.getElementById('saldoLiquido').className = 'summary-value ' + (totalCreditos - totalDebitos >= 0 ? 'positive' : 'negative');

                resumoDiv.style.display = 'flex';
                tabelaContainer.style.display = 'block';
                renderizarTabela(todasTransacoes);

            } catch (error) {
                console.error(error);
                statusDiv.innerText = "❌ Ocorreu um erro ao processar o arquivo.";
                statusDiv.style.color = "#dc2626";
            } finally {
                btn.disabled = false;
            }
        }

        function renderizarTabela(transacoes) {
            const tbody = document.getElementById('tbodyTransacoes');
            const emptyState = document.getElementById('emptyState');

            tbody.innerHTML = '';

            if (transacoes.length === 0) {
                emptyState.style.display = 'block';
                return;
            }

            emptyState.style.display = 'none';

            transacoes.forEach(t => {
                const tr = document.createElement('tr');
                const valorNum = parseFloat(t.Valor.replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                const valorClass = valorNum >= 0 ? 'valor-positivo' : 'valor-negativo';
                const valorPrefixo = valorNum >= 0 ? '+' : '';

                tr.innerHTML = `
                    <td class="col-data">${t.Data}</td>
                    <td class="col-desc">${escapeHtml(t.Descrição)}</td>
                    <td class="col-id">${escapeHtml(t['ID da operação'])}</td>
                    <td class="col-valor ${valorClass}">${valorPrefixo}${escapeHtml(t.Valor)}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filtrarTabela() {
            const mostrarNegativos = document.getElementById('chkMostrarNegativos').checked;
            const mostrarPositivos = document.getElementById('chkMostrarPositivos').checked;
            const busca = document.getElementById('filtroBusca').value.toLowerCase().trim();

            const filtradas = todasTransacoes.filter(t => {
                const valorNum = parseFloat(t.Valor.replace('R$', '').replace(/\./g, '').replace(',', '.').trim());
                const ehPositivo = valorNum >= 0;

                if (ehPositivo && !mostrarPositivos) return false;
                if (!ehPositivo && !mostrarNegativos) return false;

                if (busca) {
                    const texto = `${t.Data} ${t.Descrição} ${t['ID da operação']} ${t.Valor}`.toLowerCase();
                    if (!texto.includes(busca)) return false;
                }

                return true;
            });

            renderizarTabela(filtradas);
        }

        function formatarMoeda(valor) {
            return 'R$ ' + valor.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>

</body>

</html>
